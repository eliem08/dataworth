[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-zestimate"
version = "0.1.0"
description = "Zestimate for company data: what your data is worth to an AI lab"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
data-zestimate = "data_zestimate.__main__:main"

[tool.setuptools]
packages = ["data_zestimate"]
